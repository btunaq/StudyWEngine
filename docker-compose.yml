version: '3.8'

services:
  # 1. O Container do Frontend (React)
  frontend:
    image: node:20-alpine
    container_name: mural_react
    working_dir: /app
    # O comando abaixo mantém o container rodando e inicia o servidor de desenvolvimento
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173" # Porta padrão do Vite/React
    environment:
      - WATCHPACK_POLLING=true # Ajuda o Windows a atualizar o código em tempo real

  # 2. O Container do Backend (Python)
  backend:
    image: python:3.11-slim
    container_name: mural_python
    working_dir: /app
    # Instala as dependências e roda a API
    command: sh -c "pip install fastapi uvicorn pydantic && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"